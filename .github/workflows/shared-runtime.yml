name: Shared runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLATFORM_TEST_DSN: dbname=postgres user=postgres host=127.0.0.1 port=5432
      # Only the six optional Edge integration cases read this existing flag.
      # All graphics contracts/unit tests and PostgreSQL API tests still run.
      BOOK_MEDIA_SKIP_RENDERER_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The locked environment: uv.lock pins every dependency, platform-backend-core to the
      # reviewed Git commit in [tool.uv.sources] (tests/test_build_hygiene.py keeps the
      # Dockerfile on the same commit).
      - name: Install the locked environment (uv.lock)
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen --all-extras --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint and type check
        run: |
          ruff check --output-format=github .
          mypy .
      - name: Report optional renderer environment unavailable
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Renderer acceptance: unavailable on this hosted Linux job
          The media API, PostgreSQL isolation, schema and original graphics contract/unit checks run here.
          Six optional Edge integration cases are explicitly skipped with BOOK_MEDIA_SKIP_RENDERER_TESTS=1.
          Hosted Edge discovery previously reached a sandbox initialization abort (exit -6); this job does not change sandbox flags, ownership, permissions or host security.
          Renderer acceptance is not passed by a green Shared runtime job. Run the separate manual Optional graphics renderer workflow on Windows; its gate rejects any skipped renderer case.
          See docs/ci-renderer-gates.md for prerequisites and remaining acceptance evidence.
          SUMMARY
      - name: Run original schema and graphics contract checks
        run: bash scripts/check.sh
      # Ratchet: measured 72.92% on 2026-11-03 with the Edge renderer cases skipped
      # (ADR-0004: threshold = measured, rounded down).
      - name: Test media API and graphics contracts with explicit renderer skips
        run: python -m pytest -q -rs --cov --cov-report=term --cov-fail-under=72
      - name: Build service wheel
        run: uv build --wheel --out-dir dist .
  image:
    # Proves the Dockerfile builds from a clean checkout. Nothing is pushed or deployed.
    # The image serves the media API; the optional Edge renderer is not in it (docs/runtime.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build container image (no push)
        run: docker build --pull --tag platform-media:ci .
      - name: Image imports the service and runs as non-root
        run: |
          docker run --rm platform-media:ci python -c "import boto3, platform_backend_core, platform_media.app, platform_media.adapters, book_media_platform.graphics"
          docker run --rm platform-media:ci python -m platform_media --help
          docker run --rm platform-media:ci python -m book_media_platform.graphics --help
          test "$(docker run --rm platform-media:ci id -u)" != 0
